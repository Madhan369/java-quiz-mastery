<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded Squircle Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />
  
  <!-- Java Coffee Cup Symbol -->
  <g filter="url(#glow)">
    <!-- Steam Curves -->
    <path d="M25 15 Q28 10 25 6" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <path d="M32 15 Q35 9 32 5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.95" />
    <path d="M39 15 Q42 10 39 6" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    
    <!-- Cup Body -->
    <path d="M19 22 h26 v14 a13 13 0 0 1 -13 13 a13 13 0 0 1 -13 -13 z" fill="#ffffff" />
    
    <!-- Cup Handle -->
    <path d="M45 25 h5 a5 5 0 0 1 5 5 v2 a5 5 0 0 1 -5 5 h-5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    
    <!-- Cup Saucer -->
    <path d="M16 53 h32" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
